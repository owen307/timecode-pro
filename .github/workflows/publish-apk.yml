name: Publish APK

on:
  push:
    paths:
      - .github/workflows/publish-apk.yml

permissions:
  contents: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download the exact APK
        run: |
          curl -fL --retry 5 --retry-delay 2 -o timecode-pro-1.1.0-arm64-debug.apk "https://litter.catbox.moe/xyagsw.apk"
          echo "e82d30bf0d334ea4f2666048a741db02c0db335d6679512d2f46114c09231953  timecode-pro-1.1.0-arm64-debug.apk" | sha256sum -c -
      - name: Create GitHub release and upload the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release view v1.1.0 --repo owen307/timecode-pro >/tmp/release-out.txt 2>&1
          if [ $? -ne 0 ]; then
            gh release create v1.1.0 --repo owen307/timecode-pro --title "Timecode Pro 1.1.0" --notes "Arm64 debug APK. package com.timecodepro.app. versionName 1.1.0, versionCode 2. sha256 e82d30bf0d334ea4f2666048a741db02c0db335d6679512d2f46114c09231953" > /tmp/release-out.txt 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              gh issue create --repo owen307/timecode-pro --title "release create failed" --body-file /tmp/release-out.txt || true
              exit "$code"
            fi
          fi
          gh release upload v1.1.0 timecode-pro-1.1.0-arm64-debug.apk --repo owen307/timecode-pro --clobber > /tmp/release-out.txt 2>&1
          code=$?
          cat /tmp/release-out.txt
          if [ "$code" -ne 0 ]; then
            gh issue create --repo owen307/timecode-pro --title "release upload failed" --body-file /tmp/release-out.txt || true
          fi
          exit "$code"
